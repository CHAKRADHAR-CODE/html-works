<!-- 1b) Write a HTML program, to explain the working of hyperlinks using <a> tag and
href, target Attributes.
Note: Use text to link https://www.aec.edu.in/
Use image to linkhttps://www.aec.edu.in/?p=Gallery -->

<!DOCTYPE HTML>
<HTML>
    <HEAD> 
        <TITLE> HYPERLINK </TITLE>
    </HEAD>
    <BODY>
        <H2> HYPERLINK USING TEXT </H2>
        <A HREF = "https://www.aec.edu.in/" TARGET = "_BLANK">
            VISIT AEC WEBSITE
        </A>

        <H2> HYPERLINK USING IMAGE </H2>
        <A HREF = "https://www.aec.edu.in/?p=Gallery" TARGET = "_BLANK">
            <IMG SRC = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgw31YvahMTwR3FgtwYTbV_l92CJVCfrloWQ&s" ALT = "AU" WIDTH = "100"> 
        </A>
    </BODY>
</HTML>
