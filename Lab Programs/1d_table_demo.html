<!-- 1d) Write a HTML program, to explain the working of tables. (use tags: <table>, <tr>
<th>, <td> and attributes: border, rowspan, colspan) -->

<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <TITLE> HTML TABLES </TITLE>
    </HEAD>
    <BODY>
        <H2> STUDENT TABLE</H2>
        <TABLE BORDER = "1">
            <TR>
                <TH ROWSPAN = "2"> NAME </TH>
                <TH COLSPAN = "2"> MARKS</TH>
            </TR>

            <TR>
                <TH> MATHS </TH>
                <TH> SCIENCE </TH>
            </TR>

            <TR>
                <TD> RAVI </TD>
                <TD> 85 </TD>
                <TD> 90 </TD>
            </TR>

            <TR>
                <TD> SITA </TD>
                <TD> 88 </TD>
                <TD> 92 </TD>
            </TR>
        </TABLE>
    </BODY>
</HTML>
