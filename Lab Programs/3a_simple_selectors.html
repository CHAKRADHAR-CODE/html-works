<!-- 3) i. Simple selector (element, id, class, group, universal) -->

<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <title>Simple Selectors</title>
        
        <STYLE>
            P{COLOR:BLUE;}          /* element */
            #ID1{COLOR:RED;}        /* id */
            .CLS{COLOR:GREEN;}      /* class */
            H1,H2{COLOR:PURPLE;}    /* group */
            *{FONT-FAMILY:ARIAL;}     /* universal */
        </STYLE>
    </HEAD>
    <BODY>
        <H1> GROUP SELECTOR </H1>
        <H2> GROUP SELECTOR </H2>
        <P> ELEMENT SELECTOR </P>
        <P ID = 'ID1'> ID SELECTOR </P>
        <P CLASS = 'CLS'> CLASS SELECTOR </P>
    </BODY>
</HTML>
